[project]
name = "skrecsys"
version = "0.7.0"
description = "Recommender systems in the scikit-learn style"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mark Andreev", email = "mark.andreev@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["recommender-systems", "recsys", "machine-learning", "scikit-learn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "joblib>=1.6.0",
    # 2.5 and scipy 1.18 are 3.12+; the floors stay at the newest 3.11-compatible
    # release so that uv resolves the latest available for each interpreter.
    "numpy>=2.4.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    # typing.override is 3.12+ and typing.TypeIs 3.13+; see skrecsys._typing.
    'typing-extensions>=4.12; python_version < "3.13"',
]

[project.optional-dependencies]
pandas = ["pandas>=3.0.5"]
# Neural recommenders live in skrecsys.nn and are trained with PyTorch. The extra is
# opt-in: torch dwarfs every other dependency, and nothing outside skrecsys.nn needs it.
nn = ["torch>=2.6"]
# Third-party integrations, one extra per library: rankers for skrecsys.compose.Cascade in
# skrecsys.integrations.<extra>. Opt-in like `nn`: nothing else in the package imports them.
# Each floor is the library's release from two years back: the rankers call the libraries'
# core APIs, which keep their shape across those releases, and the `integrations` job in
# .github/workflows/tests.yml tests the floors and the latest releases. CatBoost's release
# from two years back, 1.2.7, needs numpy<2, so its floor is 1.2.8, the oldest to install
# beside the numpy floor above.
catboost = ["catboost>=1.2.8"]
# The CPU-only build, which skips the CUDA libraries (NCCL) the Linux `xgboost` wheel pulls
# in. It ships no macOS wheel; the macOS `xgboost` wheel is CPU-only anyway. Both provide
# the same `xgboost` module, so do not install `xgboost` alongside on Linux or Windows.
xgboost = [
    'xgboost-cpu>=2.1.1; sys_platform != "darwin"',
    'xgboost>=2.1.1; sys_platform == "darwin"',
]
lightgbm = ["lightgbm>=4.5"]

[project.urls]
Homepage = "https://github.com/mrk-andreev/skrecsys"
Repository = "https://github.com/mrk-andreev/skrecsys"
Issues = "https://github.com/mrk-andreev/skrecsys/issues"

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
module-name = "skrecsys._core"
python-source = "src"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "rust/kernels/Cargo.toml" },
    { file = "rust/**/*.rs" },
]

[dependency-groups]
dev = [
    # Renders README.md from README.md.j2; see benchmarks/readme.py.
    "jinja2>=3.1",
    "pandas>=3.0.5",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    # Stubs only feed `ty`, which runs on the newest interpreter; the newest
    # scipy-stubs is 3.12+, so 3.11 dev envs fall back to an older release.
    'scipy-stubs>=1.18.1.0; python_version >= "3.12"',
    'scipy-stubs>=1.17.1.5; python_version < "3.12"',
    "ty>=0.0.78",
    "typing-extensions>=4.12",
]
reference = [
    "implicit>=0.7.3",
]
# Example notebooks in notebooks/; see notebooks/AI.md.
notebooks = [
    "altair>=5.5",
    "marimo>=0.24.2",
    "pandas>=3.0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
exclude = ["notebooks/**"]  # marimo owns notebook formatting

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PYI", # flake8-pyi
    "ERA", # eradicate (commented-out code)
    "RUF", # ruff-specific rules
    "YTT", # flake8-2020
    "S", # flake8-bandit
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "A", # flake8-builtins
    "T20", # flake8-print
    "PTH", # flake8-use-pathlib
    "FLY", # flynt
    "C90", # mccabe
    "NPY", # NumPy-specific rules
    "PD", # pandas-vet
    "N", # pep8-naming
    "PERF", # Perflint
    "PGH", # pygrep-hooks
    "PL", # Pylint
    "PLC", # Convention
    "PLE", # Error
    "PLR", # Refactor
    "PLW", # Warning
    "FURB", # refurb
    "RUF", # Ruff-specific rules
    "TID251", # banned-api: see flake8-tidy-imports below
]

# `override` is re-exported from here, so ruff must know it is typing's own: an
# override is exempt from rules that its base class's signature decided (FBT001).
typing-modules = ["skrecsys._typing"]

ignore = [
    "N803", # scikit-learn convention: X is an uppercase argument name
    "N806", # scikit-learn convention: matrices such as X and R are uppercase variables
]

[tool.ruff.lint.per-file-ignores]
# assert and literal expectations are idiomatic in pytest; the pickles a test loads are
# the ones it just dumped, and the commands it runs are the reference tools it compares to.
"tests/**" = ["S101", "PLR2004", "S301", "S603", "TID251"]
# Command-line entry points: printing is their interface, and the build script's whole
# job is running the toolchain.
"benchmarks/run.py" = ["T201"]
"scripts/**" = ["T201", "S603"]
# The suite logs a failed row and keeps what the rest of the run measures.
"benchmarks/suite.py" = ["BLE001"]
"notebooks/**" = [
    "B018",     # a marimo cell displays its last expression, such as a bare UI element
    "E501",     # prose in mo.md cells: markdown tables cannot wrap
    "RUF001",   # prose in mo.md cells uses typographic dashes and the multiplication sign
    "PLC0415",  # marimo cells import inside their cell functions
    "PLR1711",  # marimo's file format ends every cell with `return`
    "S301",     # a notebook loads the pickle it has just dumped to show the round trip
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# `Any` switches type checking off for everything it touches. State what an argument must
# provide instead: a protocol from skrecsys._typing, a concrete type, or `object` for a
# value that is validated at runtime. Tests may still use it for fixtures and fakes.
"typing.Any".msg = "Use a Protocol from skrecsys._typing, a concrete type, or object."
"typing_extensions.Any".msg = "Use a Protocol from skrecsys._typing, a concrete type, or object."

[tool.ruff.lint.pep8-naming]
# `from torch.nn import functional as F` is how PyTorch itself spells it.
extend-ignore-names = ["F"]

[tool.ruff.lint.pylint]
max-args = 20

[tool.ty.environment]
# The newest supported interpreter, not the floor: targeting 3.11 makes the numpy and
# scipy stubs resolve their own version branches into false positives. Runtime
# compatibility with the floor is covered by the CI test matrix instead.
python-version = "3.14"
# The benchmark harness is a directory of scripts that import one another as siblings,
# and its tests import them the same way; this is where ty finds them.
extra-paths = ["benchmarks"]

[tool.ty.src]
include = ["src", "tests", "benchmarks"]
# Run only inside throwaway `uv run --isolated` environments, against packages and
# repositories that are deliberately absent from our own.
exclude = [
    "tests/benchmarks/_rectools_ease.py",
    "tests/benchmarks/_dacrema_rp3beta.py",
    "tests/benchmarks/_dacrema_slim.py",
    "tests/benchmarks/_cornac_bpr.py",
    # torch is an optional extra, absent from the environment this config is checked in;
    # ty.nn.toml checks these with it installed. See the `nn` job in tests.yml.
    "src/skrecsys/nn",
    "tests/nn",
    # Likewise the third-party libraries of the integrations; ty.integrations.toml checks
    # these in the `integrations` job.
    "src/skrecsys/integrations",
    "tests/integrations",
]

[tool.ty.rules]
all = "error"

[tool.marimo.ai]
enabled = false  # hide AI actions and panels

[tool.marimo.snippets]
include_default_snippets = false  # hide marimo's built-in snippets

[tool.pytest.ini_options]
addopts = "--cov=skrecsys --cov-report=term-missing -m 'not benchmark'"
testpaths = ["tests"]
# The benchmark harness is a directory of scripts rather than a package, and its modules
# import one another as siblings; the tests import them the same way.
pythonpath = ["benchmarks"]
markers = [
    "benchmark: end-to-end quality benchmarks on real datasets; downloads data, run with `pytest -m benchmark`",
]
