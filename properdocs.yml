# The pages are generated by scripts/build_site.py from README.md.j2 and docs/*.md.j2 into
# build/docs, with the navigation in build/docs/SUMMARY.md; edit those sources, not this list.
site_name: skrecsys
site_description: Recommender systems in the scikit-learn style, with Rust inner loops.
site_url: https://mrk-andreev.github.io/skrecsys/
repo_url: https://github.com/mrk-andreev/skrecsys
repo_name: mrk-andreev/skrecsys
docs_dir: build/docs
site_dir: site
theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - python
    - rust
    - bash
    - toml
  navigation_depth: 3
  collapse_navigation: false

plugins:
  - search
  - literate-nav:
      nav_file: SUMMARY.md
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
