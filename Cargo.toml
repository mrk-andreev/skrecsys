[workspace]
members = ["rust/kernels"]
# `cargo test`, `cargo clippy --all-targets` and `cargo bench` at the root cover the
# kernels as well; without this they would see only the extension module, whose own
# targets are the thin wrapper alone.
default-members = [".", "rust/kernels"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.lints.clippy]
# The broad groups are lower priority than individual, reviewed exceptions below.
correctness = { level = "deny", priority = -2 }
dbg_macro = "deny"
missing_errors_doc = "deny"
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
# Index and format conversions are checked before crossing signed integer bounds.
cast_possible_wrap = "deny"
# The remaining casts include signed sparse indices, deliberate float quantization,
# model counts represented as f64, and narrower storage formats. Audit their bounds
# and numerical behavior before denying each lint.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# These internal APIs are public so the extension and benches can call the kernels.
must_use_candidate = "allow"
# Explicit inlining is used in the small arithmetic helpers and ranking loops.
inline_always = "allow"
# Python entry points and data-oriented kernels naturally pass several related arrays.
too_many_arguments = "allow"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.dependencies]
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
    "html_reports",
    "plotters",
    "rayon",
] }
faer = { version = "0.24", default-features = false, features = ["std", "rayon"] }
multiversion = "0.9.0"
numpy = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py311"] }
rayon = "1.12"
skrecsys-kernels = { path = "rust/kernels" }

[package]
name = "skrecsys"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "_core"
path = "rust/src/lib.rs"
# Only `cdylib`: adding `rlib` back would make Cargo drop LTO silently, because it
# cannot link-time-optimize a unit that also emits an rlib. The kernels live in
# `rust/kernels` precisely so that the benches have an rlib to link without this target
# needing one.
crate-type = ["cdylib"]

[dependencies]
numpy.workspace = true
pyo3.workspace = true
rayon.workspace = true
skrecsys-kernels.workspace = true
faer.workspace = true

[profile.release]
lto = "fat"
codegen-units = 1

# Benchmarks inherit the release profile, so `cargo bench` measures the kernels as the
# wheel builds them. Debug symbols keep a profiler's output readable without changing
# the codegen.
[profile.bench]
debug = true
