[package]
name = "loadgen"
version = "0.1.0"
edition = "2024"
description = "Open-loop HTTP load generator for the micro-batching benchmark"
publish = false

# Not a member of the repository workspace: `cargo test` and `cargo clippy` at the root
# leave it alone, and it keeps its own Cargo.lock.
[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Counts and ranks of at most millions of requests, far below f64's 2^53.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

[profile.release]
opt-level = 3
